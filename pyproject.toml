[project]
name = "pyshader"
version = "0.1.0"
description = "Python-syntax shader API: typed stubs for the PyShader SPIR-V compiler"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyshader"]

[dependency-groups]
docs = [
    "mkdocs-material>=9.5",
    "mkdocs-pyshader",
    # The previews can import it: the plugin ships every installed PyShader module.
    "pyshader-stdlib",
]

[tool.uv.sources]
mkdocs-pyshader = { path = "mkdocs-pyshader", editable = true }
pyshader-stdlib = { git = "https://github.com/NucleantUI/pyshader-stdlib", branch = "master" }
