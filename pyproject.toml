[project]
name = "pyshader"
version = "0.0.7"
description = "Python-syntax shader API: typed stubs for the PyShader compiler, and a build backend that compiles shaders into wheels"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# The compiler the build backend runs; built by scripts/build_wasm.py, not committed.
artifacts = ["src/pyshader_builder/pyshader.wasm"]
exclude = ["src/pyshader_builder/plan.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/pyshader", "src/pyshader_builder"]

[dependency-groups]
test = ["pytest>=8", "wasmtime>=25"]
docs = [
    "mkdocs-material>=9.5",
    "mkdocs-pyshader",
    # The previews can import it: the plugin ships every installed PyShader module.
    "pyshader-stdlib",
]

[tool.uv.sources]
mkdocs-pyshader = { path = "mkdocs-pyshader", editable = true }
pyshader-stdlib = { git = "https://github.com/NucleantUI/pyshader-stdlib", branch = "master" }
