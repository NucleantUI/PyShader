[project]
name = "pyshader"
version = "0.1.0"
description = "Python-syntax shader API: typed stubs for the PyShader SPIR-V compiler"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyshader"]

[dependency-groups]
docs = [
    "mkdocs-material>=9.5",
    "mkdocs-pyshader",
]

[tool.uv.sources]
mkdocs-pyshader = { path = "mkdocs-pyshader", editable = true }
