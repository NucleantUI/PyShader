[project]
name = "pyshader-noise"
version = "0.1.0"
description = "Value noise and fBm for PyShader shaders"
requires-python = ">=3.13"
dependencies = ["pyshader"]

# Declares `noise` a PyShader module: the compiler imports from an
# environment's site-packages only the packages listed here.
[project.entry-points."pyshader.modules"]
noise = "noise"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noise"]
