[project]
name = "mkdocs-pyshader"
version = "0.1.0"
description = "Live WebGPU previews and a Monaco editor for PyShader code blocks in MkDocs"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mkdocs>=1.6",
    "pymdown-extensions>=10",
]

[project.entry-points."mkdocs.plugins"]
pyshader = "mkdocs_pyshader.plugin:PyShaderPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mkdocs_pyshader"]
