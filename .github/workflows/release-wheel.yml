# Builds the pyshader wheel, with the compiler the build backend runs
# (pyshader_builder/pyshader.wasm), and attaches it to the release:
# pyshader-<tag>-py3-none-any.whl. Runs when a release is published; run it
# by hand with a tag to (re)attach the wheel of a release that exists.

name: release wheel

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build the wheel for (e.g. 0.0.8)
        required: true

permissions:
  contents: write

concurrency:
  group: release-wheel-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: true

env:
  SWIFT_VERSION: 6.3.3
  TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  wheel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      # The wheel's version is the release's.
      - name: Check the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          if [ "$version" != "$TAG" ]; then
            echo "::error file=pyproject.toml::version is $version, the release tag is $TAG"
            exit 1
          fi

      # Swift via swiftly, plus the wasm SDK of the same version.
      - name: Cache Swift toolchain and wasm SDK
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/swiftly
            ~/.swiftpm/swift-sdks
          key: swift-${{ env.SWIFT_VERSION }}-wasm-${{ runner.os }}

      - name: Install Swift ${{ env.SWIFT_VERSION }}
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils git gnupg2 libc6-dev libcurl4-openssl-dev libedit2 libgcc-13-dev \
            libncurses-dev libpython3-dev libsqlite3-0 libstdc++-13-dev libxml2-dev libz3-dev pkg-config \
            tzdata unzip zlib1g-dev binaryen
          curl -fsSLO "https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz"
          tar zxf "swiftly-$(uname -m).tar.gz"
          ./swiftly init --assume-yes --no-modify-profile --skip-install --quiet-shell-followup
          . ~/.local/share/swiftly/env.sh
          swiftly install --use --assume-yes "$SWIFT_VERSION"
          echo "${SWIFTLY_BIN_DIR:-$HOME/.local/share/swiftly/bin}" >> "$GITHUB_PATH"
          if ! swift sdk list | grep -q "swift-${SWIFT_VERSION}-RELEASE_wasm"; then
            curl -fsSLO "https://download.swift.org/swift-${SWIFT_VERSION}-release/wasm-sdk/swift-${SWIFT_VERSION}-RELEASE/swift-${SWIFT_VERSION}-RELEASE_wasm.artifactbundle.tar.gz"
            swift sdk install "swift-${SWIFT_VERSION}-RELEASE_wasm.artifactbundle.tar.gz"
          fi
          swift --version
          swift sdk list

      # setup-uv publishes immutable releases without a moving major tag.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"

      # A clean build of the release's sources: no build cache.
      - name: Build pyshader.wasm
        run: uv run --no-project scripts/build_wasm.py --only swift

      - name: Build the wheel
        run: |
          uv build --wheel --out-dir dist
          wheel="dist/pyshader-$TAG-py3-none-any.whl"
          unzip -l "$wheel" | grep -q "pyshader_builder/pyshader.wasm" \
            || { echo "::error::$wheel has no pyshader_builder/pyshader.wasm"; exit 1; }
          ls -l "$wheel"

      # The build backend, on small projects, with the compiler just built.
      - name: Test the build backend
        run: uv run --group test pytest python-tests -q

      - name: Attach the wheel to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "dist/pyshader-$TAG-py3-none-any.whl" --clobber
